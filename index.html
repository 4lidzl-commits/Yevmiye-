<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:14px;color:var(--mut);margin:18px 0 6px;font-weight:600}

.top{margin-bottom:6px}.nav{margin-bottom:8px}.nav b{font-size:17px}.row{margin-bottom:12px}.row .btn{flex:1}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
#msg{font-size:12px;color:var(--mut);min-height:4px;margin-bottom:6px}
.hero{background:var(--ac);color:var(--on,#fff);border-radius:16px;padding:16px;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dn{font-size:11px;color:var(--mut);text-align:center}

.d span{font-size:16px;font-weight:700;line-height:1.1;color:var(--mut)}
.d.e{visibility:hidden}.d.su{color:var(--bad)}

.d.o{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.d.t{outline:2px solid var(--ac)}
.d.hd::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.d.hd.di::after{background:var(--bl)}
.d.nt::before{content:"✎";position:absolute;top:1px;left:4px;font-size:9px;color:var(--mut)}
.lg{font-size:11px;color:var(--mut);margin-bottom:6px}
.lst{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px 12px}

.x{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer}
.hl{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.hl.di{border-left-color:var(--bl)}.hl b{font-size:16px}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 6px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.bc small{font-size:8px;color:var(--mut);line-height:1}
.br{width:100%;background:var(--ac);opacity:.45;border-radius:3px 3px 0 0}.bc.cur .br{opacity:1}
.sh,#lk{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sh.on,#lk.on{display:flex}
#lk{background:var(--bg);align-items:center;flex-direction:column;justify-content:center;gap:12px;z-index:99}
.pn{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pn h3{margin:0 0 10px;font-size:16px}.hn{margin:0 0 10px;font-size:14px;color:var(--bl)}
.ch{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.ch button{padding:14px 0;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer}
.ch button.x{font-size:14px;font-weight:500;color:var(--mut)}
input{width:100%;padding:11px;font-size:16px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin-bottom:8px}
.sv{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--on,#fff);font-size:16px;cursor:pointer;margin-bottom:8px}

.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px 2px;font-size:13px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}

.rr{display:flex;gap:8px;align-items:center;margin-bottom:6px}.rr span{flex:0 0 120px;font-size:13px;color:var(--mut)}.rr input{margin:0}
.hero{position:relative}.eye{position:absolute;top:10px;right:10px;background:#0003;border:0;color:var(--on,#fff);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
.al{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px 12px;margin-bottom:12px;font-size:14px}.al div{padding:7px 0;border-bottom:1px solid var(--ln)}.al div:last-child{border:0}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tb{border:2px solid var(--ln);border-radius:12px;padding:6px;cursor:pointer;font-size:11px;line-height:1.2}.tb.on{border-color:var(--ac)}.tb i{display:block;height:22px;border-radius:6px;margin-bottom:5px}
.gr{font-size:17px;font-weight:600;line-height:1.35;margin:6px 0 14px;text-align:center}.gr small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-bottom:2px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.top h1{font-size:28px;line-height:1}.top .btn{justify-self:end}
.wx{display:flex;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:12px;cursor:pointer}
.wn{flex:0 0 auto;min-width:94px;border-right:1px solid var(--ln);padding-right:10px}.wn b{font-size:22px;display:block}.wn small{color:var(--mut);font-size:11px;line-height:1.35;display:block}
.wd{flex:1;display:flex;justify-content:space-between;gap:4px;text-align:center}.wd>div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}.wd small{color:var(--mut);font-size:11px}.wd span{font-size:20px;line-height:1.1}
.wxb{width:100%;margin-bottom:12px;color:var(--mut)}
body{padding-bottom:92px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.tbi{max-width:520px;margin:0 auto;display:flex}
.tbt{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;font-size:11px;cursor:pointer}.tbt span{display:block;font-size:21px;line-height:1.2}.tbt.on{color:var(--ac);font-weight:600}
.qk{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}.qk small{display:block;color:var(--mut);font-size:12px}
.qb{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}

.qb button.on{background:var(--ac);color:var(--on,#fff);border-color:var(--ac)}.qb button[data-q="o"]{font-size:13px;font-weight:500}
/* modern katman */
:root{--sh:0 1px 2px rgba(20,16,10,.05),0 8px 24px rgba(20,16,10,.07)}
@media (prefers-color-scheme:dark){:root{--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
body{font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;padding:16px 16px 108px}
button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,background .2s,opacity .2s}
button:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;box-shadow:var(--sh);border-color:transparent}
.sv{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px}

.eye{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:12px;background:#ffffff26}
.st,.qk,.wx,.al,.hl,.lst,.bars{border-radius:20px;border-color:transparent;box-shadow:var(--sh)}
.st{padding:12px 14px}.st b{font-size:20px}.qk{padding:14px}.qb{gap:10px}
.qb button{border-radius:16px;border-color:transparent;background:color-mix(in srgb,var(--ac) 10%,var(--bg))}.qb button.on{background:var(--ac)}
.cal{gap:6px}.d{border-radius:14px;border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}.d.z{border:1.5px solid var(--bad)}
.gr{font-size:20px;font-weight:700;letter-spacing:-.2px}
.top h1{color:var(--ac);display:flex;justify-content:center}.top .btn{width:40px;height:40px;padding:0;border-radius:14px}
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
.tbt{border-radius:20px;padding:7px 0 6px;font-size:10.5px}.tbt.on{background:color-mix(in srgb,var(--ac) 14%,var(--card))}.tbt span{display:block;line-height:0;margin-bottom:3px}.tbt svg{display:block;margin:0 auto}
.pn{border-radius:26px 26px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.pn::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:-8px auto 14px}
.tp{animation:tin .28s ease}#cal.sl{animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
input,select{border-radius:14px}.tb{border-radius:16px}
.spk{display:block;width:100%;height:36px;margin-top:12px;color:var(--on,#fff)}
.tl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tc{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px;text-align:left;border:0;color:var(--tx);cursor:pointer}
.tc i{display:flex;width:42px;height:42px;border-radius:14px;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);margin-bottom:10px}
.tc b{display:block;font-size:15px;margin-bottom:2px}.tc small{color:var(--mut);font-size:12px;line-height:1.3;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}.fl input,.fl select{margin:4px 0 0}
select{width:100%;padding:11px;font-size:16px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.res{background:var(--bg);border-radius:16px;padding:12px 14px;margin:6px 0 10px;font-size:15px;line-height:1.7}.res b{font-size:18px}.res small{color:var(--mut)}
.cd{text-align:right;font-size:36px;font-weight:600;padding:4px 6px;min-height:52px;word-break:break-all}.cs{text-align:right;color:var(--mut);font-size:13px;min-height:18px;padding:0 6px}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ck button{padding:16px 0;font-size:20px;border-radius:18px;border:0;background:var(--bg);color:var(--tx)}
.ck .op{background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac);font-weight:700}.ck .eq{background:var(--ac);color:var(--on,#fff);font-weight:700}
#upd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:60;background:var(--ac);color:var(--on,#fff);border-radius:16px;padding:10px 12px;align-items:center;justify-content:space-between;box-shadow:var(--sh);font-size:14px}
#upd button{background:#ffffff33;border:0;color:inherit;border-radius:12px;padding:8px 14px;font-weight:600}
#spl{position:fixed;inset:0;background:var(--ac);color:var(--on,#fff);display:flex;align-items:center;justify-content:center;z-index:120;animation:splout .5s ease .8s forwards}
#spl svg{animation:pop .7s ease}
@keyframes splout{to{opacity:0;visibility:hidden}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media print{.tp{display:block!important}.tabbar,#spl,#upd{display:none!important}#t5{display:none!important}}
@media print{.noprint,.sh,#lk{display:none!important}body{background:#fff;color:#000}.d,.st,.lst,.bars{border-color:#999}}
</style>
</head>

<script>

var GN=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
var KD={ek:"Ek ödeme",avans:"Avans / borç",kesinti:"Kesinti"};
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!s)s={};
 s.rates=(s.rates&&s.rates.length)?s.rates:[{from:"2000-01-01",rate:0}];
 s.days=s.days||{};s.notes=s.notes||{};s.moves=s.moves||[];s.pin=s.pin||"";s.lastBackup=s.lastBackup||0;s.hide=!!s.hide;s.ver=s.ver||"";s.name=s.name||"";s.nameAsked=!!s.nameAsked;s.wxc=s.wxc||(s.wxNo?null:{n:"Altınova",lat:40.70,lon:29.51});s.wx=s.wx||null;s.wxNo=!!s.wxNo;s.theme=s.theme||"auto";s.fx=s.fx||null;return s}
var S=load(),now=new Date(),Y=now.getFullYear(),M=now.getMonth(),sel=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){$("msg").textContent="Kaydedilemedi: tarayıcı depolaması kapalı ya da dolu"}}
function pad(n){return String(n).padStart(2,"0")}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function ds(d){return key(d.getFullYear(),d.getMonth(),d.getDate())}
function utc(k){var p=k.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=new Date(utc(k)+n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function diff(k){return Math.round((utc(k)-utc(ds(now)))/864e5)}
function fmtD(k){var p=k.split("-");return (+p[2])+" "+AY[+p[1]-1]+" "+p[0]}
function tl(n){return "₺"+Math.round(n).toLocaleString("tr-TR")}
function T(n,d,bg,cd,tx,mu,ac,on,ok,bad,bl,ln){return{n:n,d:d,bg:bg,cd:cd,tx:tx,mu:mu,ac:ac,on:on,ok:ok,bad:bad,bl:bl,ln:ln}}
var TH={
 auto:T("Otomatik",0,"#f4f1ea","#ffffff","#1d1d1b","#7a766c","#c2410c","#ffffff","#15803d","#b91c1c","#2563eb","#e5e0d4"),
 tersane:T("Tersane",0,"#f4f1ea","#ffffff","#1d1d1b","#7a766c","#c2410c","#ffffff","#15803d","#b91c1c","#2563eb","#e5e0d4"),

 if(hr>=5&&hr<11)P.push("Günaydın, hayırlı işler ☀️","Güne bismillah, kolay gelsin 💪","Günaydın, bugün de bereketli geçsin","Kahveni al, güne başla ☕");
 else if(hr>=11&&hr<15)P.push("İyi günler, günün nasıl geçiyor?","Günün yarısı geçti, az kaldı 💪","Öğle arası, biraz nefeslen","Kolay gelsin, iş yoğun mu?");
 else if(hr>=15&&hr<18)P.push("İyi günler, mesainin bitmesine az kaldı","Son saatler, dişini sık 💪","Çay vakti geldi ☕","Günün sonuna yaklaşıyorsun");
 else if(hr>=18&&hr<22)P.push("İyi akşamlar, yorgunluk atılsın","Eline sağlık, bugün de bitti","Akşam oldu, günün hesabını gir 📝","Eve sağ salim, dinlen biraz");
 else P.push("İyi geceler, yarın yeni gün 🌙","Geç olmuş, biraz dinlen","Uykunu al, yarın bereketli olsun");
 P=P.concat(WD[dw]);
 var n=(7-dw)%7;if(n>=1&&n<=5)P.push("Pazara "+n+" gün kaldı"+(n<=2?" 😌":""));
